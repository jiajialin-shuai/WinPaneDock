name: windows-regression

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Fast feedback. Cmux.Core has no native dependency, so this needs no
  # terminal host and no desktop session.
  core:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Build Core
        shell: pwsh
        run: dotnet build src/Cmux.Core/Cmux.Core.csproj -c Release --nologo
      - name: Run Core smoke checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/M2.Workspace-Smoke.ps1 -Configuration Release
          pwsh -NoProfile -File scripts/M3.Layout-Smoke.ps1 -Configuration Release
          pwsh -NoProfile -File scripts/M4.AgentDetection-Smoke.ps1 -Configuration Release
          pwsh -NoProfile -File scripts/M7.Git-Smoke.ps1 -Configuration Release

  # The path a new contributor actually takes: a clean checkout, no pinned
  # Windows Terminal version, no prebuilt output. The runner deliberately has
  # no Windows Terminal installed, so this fails if scripts/Copy-OpenConsole.ps1
  # cannot resolve a terminal host on an arbitrary machine.
  gui:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      # The windows-2022 image has neither Windows Terminal nor winget, so the previous
      # `winget install` step could never run: it failed with "The term 'winget' is not
      # recognized", which skipped the entire regression suite. The portable x64 zip on
      # the release page ships the same OpenConsole.exe the msix installs, so the terminal
      # host is fetched directly, with no package manager and no AppX registration.
      - name: Fetch the pinned OpenConsole host
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'OpenConsole.exe'
          pwsh -NoProfile -File scripts/Get-OpenConsoleFromRelease.ps1 -Destination $destination
          # Every later step resolves the host through this variable, including the
          # csproj Exec call, which passes no switches of its own.
          "CMUX_OPENCONSOLE_PATH=$destination" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify OpenConsole resolves on a machine without the pinned version
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'OpenConsole.resolved.exe'
          pwsh -NoProfile -File scripts/Copy-OpenConsole.ps1 -Destination $destination -RequireReferenceBuild
          Get-Content "$destination.provenance.txt"

      - name: Regression suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Test.ps1 -Configuration Release

      - name: Build MSIX package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/M10.Build-Msix.ps1

      - name: Show build metadata
        shell: pwsh
        run: Get-Content artifacts/msix-stage/build-metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: winpanedock-msix
          path: |
            artifacts/*.msix
            artifacts/msix-stage/build-metadata.txt
          if-no-files-found: error
